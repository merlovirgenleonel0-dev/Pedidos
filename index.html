<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoja de pedidos</title>
<meta name="theme-color" content="#2347C9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Concepto: hoja de surtido. Filas de libro de registro, líneas punteadas de ticket y marcatextos amarillo sobre lo que se selecciona. */
:root {
  color-scheme: light;
  --bg: #F1F4EE;
  --papel: #FFFFFF;
  --papel-t: #17201B;
  --surface: #FBFCF9;
  --surface-2: #E7ECE3;
  --ink: #17201B;
  --ink-2: #4A574F;
  --line: #D3DAD0;
  --line-2: #7C8A81;
  --accent: #2347C9;
  --accent-ink: #FFFFFF;
  --hi: #FFEF8F;
  --hi-line: #E2C530;
  --danger: #B3261E;
  --f-display: 'Roboto Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif-condensed, sans-serif;
  --f-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Roboto Mono', 'Droid Sans Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --surface: #18201B; --surface-2: #212B25; --ink: #E9EFEA; --ink-2: #A0AEA5;
    --line: #2C3830; --line-2: #64756A; --accent: #8CA6FF; --accent-ink: #0B1230;
    --hi: #4A4311; --hi-line: #9C8A1C; --danger: #FF8F85; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --surface: #18201B; --surface-2: #212B25; --ink: #E9EFEA; --ink-2: #A0AEA5;
  --line: #2C3830; --line-2: #64756A; --accent: #8CA6FF; --accent-ink: #0B1230;
  --hi: #4A4311; --hi-line: #9C8A1C; --danger: #FF8F85; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app {
  max-width: 1180px; margin: 0 auto;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 960px) { .app { padding-bottom: 48px; } }

/* Encabezado */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 24px; border-bottom: 2px solid var(--ink); margin-bottom: 20px; }
.marca { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 6vw, 42px); line-height: .95; text-transform: uppercase; letter-spacing: .02em; padding-bottom: 10px; }
.tabs { display: flex; gap: 4px; margin-bottom: -2px; }
.tab { display: flex; align-items: baseline; gap: 8px; min-height: 44px; padding: 10px 12px 7px; background: none; border: 0; border-bottom: 5px solid transparent; color: var(--ink-2); font-family: var(--f-display); font-weight: 600; font-size: 19px; text-transform: uppercase; letter-spacing: .06em; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .cuenta { font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); }

/* Botones y campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--line-2); background: transparent; color: var(--ink); font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primario:hover { filter: brightness(1.1); }
.btn.chico { min-height: 36px; padding: 0 12px; font-size: 14.5px; }
.btn.texto { border-color: transparent; color: var(--accent); padding: 0 10px; }
.btn.texto.peligro { color: var(--danger); }
.btn.peligro-s { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.peligro-s:hover { filter: brightness(1.1); background: var(--danger); }

.campo { display: grid; gap: 4px; min-width: 0; }
.campo > span { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], select {
  width: 100%; min-width: 0; min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface);
}
input[type="number"] { font-family: var(--f-mono); }
input::placeholder { color: var(--ink-2); opacity: .75; }
input[type="checkbox"] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); }

/* Disposición */
.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.barra .buscar { flex: 1 1 180px; min-width: 0; }
.cols { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.col { min-width: 0; }
@media (min-width: 960px) {
  .cols { grid-template-columns: minmax(0, 1fr) minmax(340px, .95fr); }
  .resumen { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
}

/* Avisos */
.aviso { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; margin-bottom: 14px; background: var(--hi); border: 1px solid var(--hi-line); border-radius: 4px; font-size: 14.5px; }
.aviso.suave { background: var(--surface-2); border-color: var(--line); }
.etiqueta { display: inline-block; margin-left: 8px; padding: 1px 6px; border: 1px solid var(--line-2); border-radius: 3px; color: var(--ink-2); font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; vertical-align: middle; }

/* Listas tipo libro de registro */
.lista { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
.lista > :last-child { border-bottom: 0; }
.pedido { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 12px; padding: 12px 14px 6px; border-bottom: 1px solid var(--line); }
.pedido.sel { background: var(--hi); border-bottom-color: var(--hi-line); }
.pedido-main { display: block; min-width: 0; cursor: pointer; }
.pedido-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; }
.cliente { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.fecha { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.renglones { display: block; margin-top: 3px; font-size: 14.5px; color: var(--ink-2); }
.renglones .rg b { font-weight: 500; color: var(--ink); }
.renglones .rg + .rg::before { content: " · "; color: var(--line-2); }
.acciones { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-left: -10px; }
.acciones .conf { padding: 0 6px 0 10px; font-size: 14.5px; font-weight: 600; }

.art-fila { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 12px 14px 6px; border-bottom: 1px solid var(--line); }
.art-fila .nom { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.art-fila .uni { font-family: var(--f-mono); color: var(--ink-2); font-size: 14px; align-self: baseline; }
.art-fila .sub { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); }
.art-fila .acciones { grid-column: 1 / -1; }

.vacio { padding: 28px 18px; border: 1px dashed var(--line-2); border-radius: 6px; background: var(--surface); display: grid; gap: 6px; }
.vacio-t { font-family: var(--f-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; }
.vacio p:last-child { color: var(--ink-2); max-width: 52ch; }

/* Formularios */
.panel { display: grid; gap: 14px; padding: 16px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--ink); border-radius: 6px; }
.panel-t { font-family: var(--f-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; }
.panel-acc { display: flex; flex-wrap: wrap; gap: 8px; }
.fila-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 220px); gap: 12px; }
@media (max-width: 559px) { .fila-2 { grid-template-columns: minmax(0, 1fr); } }
.renglones-form { display: grid; gap: 8px; }
.rg-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rg-form select { flex: 1 1 220px; width: auto; }
.cant-box { display: flex; align-items: center; gap: 8px; }
.cant-box input { width: 120px; }
.cant-box .u { min-width: 4ch; color: var(--ink-2); font-size: 14px; }
.error { color: var(--danger); font-weight: 600; font-size: 14.5px; }
.panel > .btn.chico { justify-self: start; }

/* Consolidado */
.resumen { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; min-width: 0; }
.res-cab { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 12px; padding: 14px 16px; border-bottom: 2px solid var(--ink); }
.acc-res { display: flex; flex-wrap: wrap; gap: 8px; }
.pie { margin-top: 28px; padding-top: 14px; border-top: 2px dotted var(--line-2); display: grid; gap: 10px; font-size: 14px; color: var(--ink-2); }
.pie p { margin: 0; max-width: 60ch; }
.total-ped { margin-left: auto; padding-right: 4px; font-weight: 600; }
.total-form { margin: 0; font-weight: 600; min-height: 1.2em; }
.neg-cols { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 760px) { .neg-cols { grid-template-columns: minmax(0, 1fr) minmax(0, 330px); } }
.neg-ayuda { margin: 0; color: var(--ink-2); font-size: 14px; }
.logo-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tk-prev { background: var(--papel); color: var(--papel-t); border: 1px solid var(--line-2); padding: 16px 18px; font-family: var(--f-mono); font-size: 13px; line-height: 1.45; text-align: center; max-width: 320px; }
.tk-prev .tk-logo { display: block; margin: 0 auto 8px; max-width: 70%; height: auto; image-rendering: pixelated; }
.tk-prev .tk-n { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.tk-prev .tk-s { border-top: 1px dashed var(--papel-t); margin: 8px 0; }
.tk-prev .tk-i { text-align: left; overflow-wrap: anywhere; }
.tk-prev .tk-r { display: flex; justify-content: space-between; gap: 8px; text-align: left; }
.tk-prev .tk-b { font-weight: 600; }
@media (max-width: 480px) { .tabs { flex-wrap: nowrap; } .tab { font-size: 15px; padding: 10px 6px 7px; gap: 4px; white-space: nowrap; } }
.solo-lector { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.res-tk { display: grid; gap: 10px; padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.res-tk-t { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin-right: auto; }
.res-tk select { width: auto; min-height: 36px; padding: 4px 8px; font-size: 14.5px; }
.res-tk-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fila-tk { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.fila-tk-t { font-weight: 600; font-size: 14.5px; }
.fila-tk-b { display: flex; flex-wrap: wrap; gap: 8px; }
.tk-cli { display: grid; gap: 8px; padding: 10px 14px; margin-bottom: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; }
.tk-cli-t { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; font-size: 14.5px; }
.tk-cli-t span { color: var(--ink-2); font-size: 13px; }
.tk-cli-b { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tk-cli select { width: auto; min-height: 36px; padding: 4px 8px; font-size: 14.5px; }
.res-titulo { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .03em; }
.res-stats { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
.res-vacio { padding: 20px 16px 24px; color: var(--ink-2); max-width: 46ch; }
.art { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.art:last-child { border-bottom: 0; }
.art-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.art-nombre { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.art-total { white-space: nowrap; }
.art-total .num { padding: 0 3px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 26px; background: linear-gradient(transparent 58%, var(--hi) 58%); }
.art-total small { margin-left: 4px; font-family: var(--f-mono); font-size: 14px; color: var(--ink-2); }
.por { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.por li { display: flex; align-items: baseline; gap: 8px; font-size: 14.5px; }
.por .por-n { min-width: 0; overflow-wrap: anywhere; }
.por .lider { flex: 1 1 12px; min-width: 12px; border-bottom: 2px dotted var(--line-2); transform: translateY(-3px); }
.por .q { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 500; }

/* Barra inferior (teléfono) y aviso emergente */
.barra-sel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-top: 2px solid var(--ink); }
.barra-sel .t { font-weight: 600; }
@media (min-width: 960px) { .barra-sel { display: none !important; } }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 4px; background: var(--ink); color: var(--bg); font-size: 14.5px; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .18s, transform .18s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 960px) { .toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="marca">Hoja de pedidos</h1>
    <nav class="tabs" aria-label="Secciones">
      <button type="button" class="tab" data-acc="vista" data-id="pedidos" aria-current="page">Pedidos <span class="cuenta" id="n-pedidos">0</span></button>
      <button type="button" class="tab" data-acc="vista" data-id="articulos">Artículos <span class="cuenta" id="n-articulos">0</span></button>
      <button type="button" class="tab" data-acc="vista" data-id="negocio">Mi negocio</button>
    </nav>
  </header>

  <div id="avisos"></div>

  <main>
    <section id="vista-pedidos" aria-label="Pedidos">
      <div class="cols">
        <div class="col">
          <div class="barra">
            <button type="button" class="btn primario" data-acc="nuevo-pedido">Nuevo pedido</button>
            <input type="search" id="buscar" class="buscar" placeholder="Buscar cliente o artículo" aria-label="Buscar cliente o artículo" autocomplete="off">
            <button type="button" class="btn chico" data-acc="sel-todos">Marcar todos</button>
            <button type="button" class="btn chico" data-acc="sel-ninguno">Quitar marcas</button>
          </div>
          <div id="barra-tk"></div>
          <div id="host-form-pedido"></div>
          <div id="lista-pedidos"></div>
        </div>
        <aside class="resumen" id="resumen" aria-label="Consolidado de los pedidos marcados"></aside>
      </div>
    </section>

    <section id="vista-negocio" aria-label="Mi negocio" hidden>
      <div id="host-negocio"></div>
    </section>

    <section id="vista-articulos" aria-label="Artículos" hidden>
      <div class="barra">
        <button type="button" class="btn primario" data-acc="nuevo-art">Nuevo artículo</button>
      </div>
      <div id="host-form-art"></div>
      <div id="lista-articulos"></div>
    </section>
  </main>

  <div id="host-login"></div>
  <footer class="pie" id="pie"></footer>
  <input type="file" id="archivo-respaldo" class="solo-lector" accept=".json,application/json" tabindex="-1" aria-hidden="true">

  <div class="barra-sel" id="barra-sel" hidden>
    <span class="t" id="barra-sel-t"></span>
    <button type="button" class="btn primario chico" data-acc="ir-resumen">Ver consolidado</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';

  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 2 });
  const money = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
  const dinero = n => money.format(n);
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const norm = s => String(s ?? '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const byNombre = (a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es', { sensitivity: 'base' });
  const redondea = n => Math.round(n * 100) / 100;
  const pl = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);
  const itemsDe = p => (p && Array.isArray(p.items) ? p.items : []);
  const UNIDADES = ['pza', 'kg', 'g', 'litro', 'caja', 'bulto', 'costal', 'paquete', 'docena', 'metro'];

  function hoy() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fechaCorta(iso) {
    const d = new Date(String(iso) + 'T12:00:00');
    if (isNaN(d)) return String(iso || '');
    return d.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/[.,]/g, '');
  }

  /* ---------- Estado ---------- */
  const S = {
    articulos: [], pedidos: [],
    modo: 'local',
    restaurar: null,
    sync: sincBase(), nube: { estado: 'sin-sesion', msg: '' }, login: null, cambioCuenta: null,
    negocio: { nombre: '', frase: '', telefono: '', direccion: '', pie: '', logo: null },
    vista: 'pedidos',
    sel: new Set(),
    q: '',
    formPedido: null, formArt: null,
    borrando: null,              // 'p:ID' | 'a:ID'
    seedSel: false, ocupado: false,
    papel: '58'                  // ancho del papel del ticket, en mm
  };
  try { if (localStorage.getItem('hoja-papel') === '80') S.papel = '80'; } catch (e) { /* sin almacenamiento */ }

  /* ---------- Persistencia ---------- */
  const LS = 'hoja-de-pedidos-v1';
  function lsLoad() {
    try {
      const raw = localStorage.getItem(LS);
      if (raw === null) return false;
      const j = JSON.parse(raw);
      S.articulos = Array.isArray(j.articulos) ? j.articulos : [];
      S.pedidos = Array.isArray(j.pedidos) ? j.pedidos : [];
      S.negocio = Object.assign({ nombre: '', frase: '', telefono: '', direccion: '', pie: '', logo: null }, j.negocio || {});
      S.sync = Object.assign(sincBase(), j.sync || {});
      S.articulos.forEach(a => { if (!a.act) a.act = a.creado || 1; });
      S.pedidos.forEach(p => { if (!p.act) p.act = p.creado || 1; });
      return true;
    } catch (e) { return false; }
  }
  function lsSave() {
    try { localStorage.setItem(LS, JSON.stringify({ articulos: S.articulos, pedidos: S.pedidos, negocio: S.negocio, sync: S.sync })); return true; }
    catch (e) { return false; }
  }
  async function put(col, obj) {
    const arr = S[col];
    const i = arr.findIndex(x => x.id === obj.id);
    const prev = i >= 0 ? arr[i] : null;
    const tipo = col === 'articulos' ? 'articulo' : 'pedido';
    const borrAntes = S.sync.borr;
    obj.act = Date.now();
    if (i >= 0) arr[i] = obj; else arr.push(obj);
    if (!obj.ejemplo) { S.sync.borr = S.sync.borr.filter(x => !(x.id === obj.id && x.tipo === tipo)); S.sync.pend[tipo + ':' + obj.id] = 1; }
    if (!lsSave()) {
      if (i >= 0) arr[i] = prev; else arr.pop();
      S.sync.borr = borrAntes;
      throw { code: 'local' };
    }
    renderTodo();
    programarSync();
  }
  async function del(col, id) {
    const antes = S[col], borrAntes = S.sync.borr;
    const tipo = col === 'articulos' ? 'articulo' : 'pedido';
    const viejo = antes.find(x => x.id === id);
    S[col] = antes.filter(x => x.id !== id);
    if (viejo && !viejo.ejemplo) {
      S.sync.borr = S.sync.borr.filter(x => !(x.id === id && x.tipo === tipo)).concat({ id, tipo, act: Date.now() });
      S.sync.pend[tipo + ':' + id] = 1;
    }
    if (!lsSave()) { S[col] = antes; S.sync.borr = borrAntes; throw { code: 'local' }; }
    renderTodo();
    programarSync();
  }
  function mensajeError(e) {
    const c = e && e.code;
    if (c === 'local') return 'No se pudo guardar en este navegador. Revisa que no esté en modo privado y que tenga espacio.';
    if (c === 'invalid_argument') return 'No se pudo guardar. Revisa que tengas permiso para editar esta página.';
    if (c === 'quota_exceeded') return 'La base de datos está llena. Borra pedidos viejos para seguir guardando.';
    if (c === 'resource_exhausted') return 'Demasiadas operaciones seguidas. Espera un momento e intenta de nuevo.';
    return 'No se pudo guardar. Intenta de nuevo.';
  }
  async function hacer(fn, ok) {
    try { await fn(); if (ok) aviso(ok); return true; }
    catch (e) { aviso(mensajeError(e)); return false; }
  }
  let tToast;
  function aviso(m) {
    const t = $('#toast');
    t.textContent = m; t.classList.add('show');
    clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ---------- Datos derivados ---------- */
  const mapaArt = () => new Map(S.articulos.map(a => [a.id, a]));
  const ordenados = () => [...S.pedidos].sort((a, b) =>
    String(b.fecha || '').localeCompare(String(a.fecha || '')) || (b.creado || 0) - (a.creado || 0));

  function resolver(it, mapA) {
    const a = it.a ? mapA.get(it.a) : null;
    return {
      key: it.a ? 'a:' + it.a : 'n:' + norm(it.n) + '|' + norm(it.u),
      nombre: a ? a.nombre : (it.n || 'Artículo'),
      unidad: a ? a.unidad : (it.u || ''),
      cantidad: Number(it.c) || 0
    };
  }

  function consolidar() {
    const mapA = mapaArt();
    const grupos = new Map();
    const clientes = new Set();
    let n = 0;
    for (const p of S.pedidos) {
      if (!S.sel.has(p.id)) continue;
      n++;
      const ck = norm(p.cliente);
      clientes.add(ck);
      for (const it of itemsDe(p)) {
        const r = resolver(it, mapA);
        let g = grupos.get(r.key);
        if (!g) { g = { nombre: r.nombre, unidad: r.unidad, total: 0, por: new Map() }; grupos.set(r.key, g); }
        g.total += r.cantidad;
        const c = g.por.get(ck) || { cliente: String(p.cliente || '').trim() || 'Sin nombre', cant: 0 };
        c.cant += r.cantidad;
        g.por.set(ck, c);
      }
    }
    const articulos = [...grupos.values()].map(g => ({
      nombre: g.nombre, unidad: g.unidad, total: redondea(g.total),
      clientes: [...g.por.values()].map(c => ({ cliente: c.cliente, cant: redondea(c.cant) }))
        .sort((a, b) => a.cliente.localeCompare(b.cliente, 'es', { sensitivity: 'base' }))
    })).sort(byNombre);
    return { pedidos: n, clientes: clientes.size, articulos };
  }

  function pedidosFiltrados() {
    const q = norm(S.q);
    const mapA = mapaArt();
    return ordenados().filter(p => !q || norm(p.cliente).includes(q) ||
      itemsDe(p).some(it => norm(resolver(it, mapA).nombre).includes(q)));
  }

  async function guardarPedido() {
    const f = S.formPedido;
    if (!f || S.ocupado) return;
    const cliente = f.cliente.trim().replace(/\s+/g, ' ');
    if (!cliente) return errPedido('Escribe el nombre del cliente.');
    const mapA = mapaArt();
    const juntos = new Map();
    for (const it of f.items) {
      if (!it.a && String(it.c).trim() === '') continue;
      if (!it.a) return errPedido('Elige el artículo en cada renglón.');
      const c = parseFloat(String(it.c).replace(',', '.'));
      if (!(c > 0)) return errPedido('Escribe una cantidad mayor que cero en cada renglón.');
      const a = mapA.get(it.a);
      const prev = juntos.get(it.a);
      if (prev) prev.c = redondea(prev.c + c);
      else { const pr = a && a.precio != null ? a.precio : (it.p != null ? it.p : null); juntos.set(it.a, { a: it.a, n: a ? a.nombre : it.n, u: a ? a.unidad : it.u, c: redondea(c), ...(pr != null ? { p: pr } : {}) }); }
    }
    if (!juntos.size) return errPedido('Agrega al menos un artículo con su cantidad.');
    errPedido('');
    const obj = { id: f.id || uid(), cliente, fecha: f.fecha || hoy(), items: [...juntos.values()], creado: f.creado || Date.now() };
    S.ocupado = true;
    const ok = await hacer(() => put('pedidos', obj), f.id ? 'Pedido actualizado' : 'Pedido guardado');
    S.ocupado = false;
    if (ok) {
      if (!f.id) S.sel.add(obj.id);
      S.formPedido = null; renderFormPedido();
      renderPedidos(); renderResumen(); renderBarra();
    }
  }

  async function guardarArt() {
    const f = S.formArt;
    if (!f || S.ocupado) return;
    const nombre = f.nombre.trim().replace(/\s+/g, ' ');
    const unidad = (f.unidad || '').trim() || 'pza';
    if (!nombre) return errArt('Escribe el nombre del artículo.');
    if (S.articulos.some(a => a.id !== f.id && norm(a.nombre) === norm(nombre))) return errArt('Ya existe un artículo con ese nombre.');
    const prTxt = String(f.precio == null ? '' : f.precio).trim().replace(',', '.');
    const pr = prTxt === '' ? null : parseFloat(prTxt);
    if (pr !== null && !(pr >= 0)) return errArt('Escribe un precio válido o déjalo vacío.');
    errArt('');
    const obj = { id: f.id || uid(), nombre, unidad, creado: f.creado || Date.now(), ...(pr !== null ? { precio: redondea(pr) } : {}) };
    S.ocupado = true;
    const ok = await hacer(() => put('articulos', obj), f.id ? 'Artículo actualizado' : 'Artículo agregado');
    S.ocupado = false;
    if (!ok) return;
    if (f.id) { S.formArt = null; renderFormArt(); }
    else { S.formArt = { id: null, nombre: '', unidad, creado: null, error: '' }; renderFormArt(); enfoca('#fa-nombre'); }
    renderArticulos(); renderTabs();
  }

  function copiar() {
    const R = consolidar();
    if (!R.pedidos) return;
    const txt = textoLista(R);
    const alt = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = txt; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
        document.body.appendChild(ta); ta.select();

  /* ---------- Escritor de PDF mínimo: sin librerías, funciona sin internet ---------- */
  const HW = {32:278,33:278,34:355,35:556,36:556,37:889,38:667,39:191,40:333,41:333,42:389,43:584,44:278,45:333,46:278,47:278,48:556,49:556,50:556,51:556,52:556,53:556,54:556,55:556,56:556,57:556,58:278,59:278,60:584,61:584,62:584,63:556,64:1015,65:667,66:667,67:722,68:722,69:667,70:611,71:778,72:722,73:278,74:500,75:667,76:556,77:833,78:722,79:778,80:667,81:778,82:722,83:667,84:611,85:722,86:667,87:944,88:667,89:667,90:611,91:278,92:278,93:278,94:469,95:556,96:333,97:556,98:556,99:500,100:556,101:556,102:278,103:556,104:556,105:222,106:222,107:500,108:222,109:833,110:556,111:556,112:556,113:556,114:333,115:500,116:278,117:556,118:500,119:722,120:500,121:500,122:500,123:334,124:260,125:334,126:584};

      else if (c === 0x201C || c === 0x201D) c = 34;

  function nuevoPdf(anchoMm, altoDefault) {

      color(g) { cur.ops.push(num(g) + ' g'); },

      },
      linea(x1, y1, x2, y2, gris, grosor) {
        cur.ops.push(num(gris) + ' G ' + num(grosor * K) + ' w ' + num(x1 * K) + ' ' + num(cur.H - y1 * K) + ' m ' + num(x2 * K) + ' ' + num(cur.H - y2 * K) + ' l S 0 G');
      },
      /* Imagen en blanco y negro (1 bit por punto). im = { w, h, datos } con datos como cadena binaria */
      imagen(x, y, w, h, im) {
        img = img || im;

        objs.push('<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>');
        for (const k of ['h', 'hb', 'c', 'cb']) objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /' + FUENTES[k][1] + ' /Encoding /WinAnsiEncoding >>');
        if (img) objs.push('<< /Type /XObject /Subtype /Image /Width ' + img.w + ' /Height ' + img.h + ' /ColorSpace /DeviceGray /BitsPerComponent 1 /Length ' + img.datos.length + ' >>\nstream\n' + img.datos + '\nendstream');
        paginas.forEach((p, i) => {
          const cont = p.ops.join('\n');
          objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + num(W) + ' ' + num(p.H) + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >>' + (img ? ' /XObject << /Im1 7 0 R >>' : '') + ' >> /Contents ' + (base + 1 + i * 2) + ' 0 R >>');

  function envuelvePdf(pdf, txt, maxW, f, pt) {

      while (p.length > 1 && pdf.ancho(p, f, pt) > maxW) {
        let k = p.length - 1;
        while (k > 1 && pdf.ancho(p.slice(0, k), f, pt) > maxW) k--;

      const t = cur ? cur + ' ' + p : p;
      if (!cur || pdf.ancho(t, f, pt) <= maxW) cur = t; else { r.push(cur); cur = p; }
    }

    return r.length ? r : [''];
  }

  function crearPdf(R) {
    const pdf = nuevoPdf(210, 297);

    const fecha = new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
    let y = m;
    const cabecera = () => {
      pdf.relleno(m, y, 210 - 2 * m, 9, 0.9);
      pdf.texto(xP, y + 6, 'Producto', 'hb', 11);
      pdf.texto(xQ, y + 6, 'Cantidad', 'hb', 11, 'der');

    pdf.color(0.35);
    pdf.texto(m, y + 13, fecha + ' - ' + pl(R.pedidos, 'pedido', 'pedidos'), 'h', 10);
    pdf.color(0);
    y += 22;
    cabecera();
    for (const g of R.articulos) {
      const cant = fmt.format(g.total) + ' ' + g.unidad;
      const lineas = envuelvePdf(pdf, g.nombre, (xQ - xP) - pdf.ancho(cant, 'h', 11) - 8, 'h', 11);
      const alto = Math.max(9, lineas.length * 5 + 4);
      if (y + alto > H - m) { pdf.pagina(); y = m; cabecera(); }

      pdf.texto(xQ, y + 6, cant, 'h', 11, 'der');

      if (lleno(N.pie)) { c7(''); centro(String(N.pie).trim()); }
      c7(''); c7('');
      const alto = Math.max(40, margen * 2 + (logo ? logoH + 3 : 0) + L.reduce((a, x) => a + paso(x), 0));

      if (logo) { pdf.imagen((ancho - logoW) / 2, y, logoW, logoH, { w: logo.w, h: logo.h, datos }); y += logoH + 3; }

  /* ---------- Logo en blanco y negro (para impresora térmica) ---------- */
  async function procesarLogo(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('img')); i.src = url; });
      const factor = Math.min(384 / img.naturalWidth, 192 / img.naturalHeight);
      const w = Math.max(8, Math.round(img.naturalWidth * factor)), h = Math.max(8, Math.round(img.naturalHeight * factor));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d', { willReadFrequently: true });
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
      cx.drawImage(img, 0, 0, w, h);
      const d = cx.getImageData(0, 0, w, h).data;
      const g = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = y * w + x, v = g[i], nv = v < 128 ? 0 : 255, e = v - nv;
        g[i] = nv;
        if (x + 1 < w) g[i + 1] += e * 7 / 16;
        if (y + 1 < h) {
          if (x > 0) g[i + w - 1] += e * 3 / 16;
          g[i + w] += e * 5 / 16;
          if (x + 1 < w) g[i + w + 1] += e / 16;
        }
      }
      const fila = Math.ceil(w / 8), bytes = new Uint8Array(fila * h);
      for (let y = 0; y < h; y++) for (let x = 0; x < fila * 8; x++) if (x >= w || g[y * w + x] >= 128) bytes[y * fila + (x >> 3)] |= 0x80 >> (x & 7);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return { w, h, b64: btoa(bin) };
    } finally { URL.revokeObjectURL(url); }
  }
  const logoCache = { b64: null, url: '' };
  function logoUrl(l) {
    if (logoCache.b64 === l.b64) return logoCache.url;
    const bin = atob(l.b64), fila = Math.ceil(l.w / 8);
    const cv = document.createElement('canvas'); cv.width = l.w; cv.height = l.h;
    const cx = cv.getContext('2d'), im = cx.createImageData(l.w, l.h);
    for (let y = 0; y < l.h; y++) for (let x = 0; x < l.w; x++) {
      const v = ((bin.charCodeAt(y * fila + (x >> 3)) >> (7 - (x & 7))) & 1) ? 255 : 0, o = (y * l.w + x) * 4;
      im.data[o] = im.data[o + 1] = im.data[o + 2] = v; im.data[o + 3] = 255;
    }
    cx.putImageData(im, 0, 0);
    logoCache.b64 = l.b64; logoCache.url = cv.toDataURL('image/png');
    return logoCache.url;
  }

    const ids = [
      ...S.pedidos.filter(p => p.ejemplo).map(p => ['pedidos', p.id]),
      ...S.articulos.filter(a => a.ejemplo).map(a => ['articulos', a.id])
    ];
    try {
      for (const [col, id] of ids) { await del(col, id); S.sel.delete(id); }
      aviso('Ejemplos quitados');
      renderTodo();
    } catch (e) { aviso(mensajeError(e)); }
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-acc]');
    if (!b) return;
    const acc = b.dataset.acc, id = b.dataset.id, i = Number(b.dataset.i);
    switch (acc) {
      case 'vista': S.vista = id; renderTabs(); renderBarra(); break;
      case 'nuevo-pedido':
        S.formPedido = { id: null, cliente: '', fecha: hoy(), items: [{ a: '', n: '', u: '', c: '' }], creado: null, error: '' };
        renderFormPedido(); enfoca('#fp-cliente'); break;
      case 'editar-pedido': {
        const p = S.pedidos.find(x => x.id === id); if (!p) break;
        S.formPedido = { id: p.id, cliente: String(p.cliente || ''), fecha: p.fecha || hoy(), creado: p.creado || null, error: '',
          items: itemsDe(p).map(it => ({ a: it.a || '', n: it.n || '', u: it.u || '', c: String(it.c ?? ''), p: it.p })) };
        if (!S.formPedido.items.length) S.formPedido.items.push({ a: '', n: '', u: '', c: '' });
        renderFormPedido(); enfoca('#fp-cliente'); break;
      }
      case 'cancelar-pedido': S.formPedido = null; renderFormPedido(); break;
      case 'add-renglon':
        if (!S.formPedido) break;
        S.formPedido.items.push({ a: '', n: '', u: '', c: '' });
        renderFormPedido(); enfoca('#fp-art-' + (S.formPedido.items.length - 1)); break;
      case 'quitar-renglon':
        if (!S.formPedido) break;
        S.formPedido.items.splice(i, 1);
        if (!S.formPedido.items.length) S.formPedido.items.push({ a: '', n: '', u: '', c: '' });
        renderFormPedido(); break;
      case 'borrar-pedido': S.borrando = 'p:' + id; renderPedidos(); break;
      case 'borrar-art': S.borrando = 'a:' + id; renderArticulos(); break;
      case 'cancelar-borrar': S.borrando = null; renderPedidos(); renderArticulos(); break;
      case 'confirmar-borrar-pedido':
        S.borrando = null; S.sel.delete(id);
        hacer(() => del('pedidos', id), 'Pedido borrado').then(() => { renderPedidos(); renderResumen(); renderBarra(); });
        break;
      case 'confirmar-borrar-art':
        S.borrando = null;
        hacer(() => del('articulos', id), 'Artículo borrado').then(() => { renderArticulos(); renderPedidos(); renderResumen(); });
        break;
      case 'sel-todos': pedidosFiltrados().forEach(p => S.sel.add(p.id)); renderPedidos(); renderResumen(); renderBarra(); break;
      case 'sel-ninguno': S.sel.clear(); renderPedidos(); renderResumen(); renderBarra(); break;
      case 'copiar': copiar(); break;
      case 'pdf': descargarPdf(); break;
      case 'tk-pedido': { const p = S.pedidos.find(x => x.id === id); if (p) ticketsClientes([p], true, 'ticket-' + nombreArchivo(p.cliente)); break; }
      case 'tk-clientes': ticketsClientes(marcadosPorCliente(), false, 'tickets-clientes'); break;
      case 'tk-clientes-compartir': ticketsClientes(marcadosPorCliente(), true, 'tickets-clientes'); break;
      case 'elegir-logo': $('#logo-archivo').click(); break;
      case 'quitar-logo': S.negocio.logo = null; guardarNegocio(); renderNegocio(); break;
      case 'respaldar': respaldar(); break;
      case 'elegir-respaldo': $('#archivo-respaldo').click(); break;
      case 'confirmar-restaurar':
        if (S.restaurar) {
          const ant = JSON.stringify([S.articulos, S.pedidos, S.negocio, S.sync]);
          reemplazarTodo(S.restaurar);
          if (!lsSave()) { const x = JSON.parse(ant); S.articulos = x[0]; S.pedidos = x[1]; S.negocio = x[2]; S.sync = x[3]; aviso(mensajeError({ code: 'local' })); }
          else { S.sel.clear(); S.restaurar = null; aviso('Respaldo restaurado'); renderTodo(); programarSync(); }
        } break;
      case 'cancelar-restaurar': S.restaurar = null; renderAvisos(); break;
      case 'abrir-login': S.login = { modo: 'entrar', correo: S.sync.correo || '', clave: '', error: '', ocupado: false }; renderLogin(); enfoca(S.login.correo ? '#lg-clave' : '#lg-correo'); break;
      case 'login-modo': if (S.login && !S.login.ocupado) { S.login.modo = S.login.modo === 'entrar' ? 'crear' : 'entrar'; S.login.error = ''; renderLogin(); } break;
      case 'login-cancelar': S.login = null; renderLogin(); break;
      case 'sincronizar': sincronizar(true); break;
      case 'cerrar-sesion': guardarSesion(null); S.nube = { estado: 'sin-sesion', msg: '' }; renderPie(); aviso('Sesión cerrada. Tus datos siguen en este celular.'); break;
      case 'confirmar-cambio-cuenta':
        if (S.cambioCuenta) {
          const ses = S.cambioCuenta;
          S.articulos = []; S.pedidos = []; S.negocio = negocioBase(); S.sync = sincBase(); S.sel.clear();
          iniciarSesion(ses); renderTodo();
        } break;
      case 'cancelar-cambio-cuenta': S.cambioCuenta = null; renderAvisos(); break;
      case 'ir-resumen': $('#resumen').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'ir-articulos':
        S.vista = 'articulos'; S.formPedido = null; renderFormPedido();
        S.formArt = { id: null, nombre: '', unidad: 'pza', creado: null, error: '' };
        renderTabs(); renderBarra(); renderFormArt(); enfoca('#fa-nombre'); break;
      case 'nuevo-art':
        S.formArt = { id: null, nombre: '', unidad: 'pza', creado: null, error: '' };
        renderFormArt(); enfoca('#fa-nombre'); break;
      case 'editar-art': {
        const a = S.articulos.find(x => x.id === id); if (!a) break;
        S.formArt = { id: a.id, nombre: String(a.nombre || ''), unidad: a.unidad || 'pza', precio: a.precio != null ? String(a.precio) : '', creado: a.creado || null, error: '' };
        renderFormArt(); enfoca('#fa-nombre'); break;
      }
      case 'cancelar-art': S.formArt = null; renderFormArt(); break;
      case 'quitar-ejemplos': quitarEjemplos(); break;
    }
  });

  function capturar(t) {
    const f = t.dataset && t.dataset.f;
    if (!f) return;
    if (f.startsWith('neg-')) { S.negocio[f.slice(4)] = t.value; pintaPreview(); return; }
    if (f.startsWith('lg-')) { if (S.login) S.login[f.slice(3)] = t.value; return; }
    if (f === 'papel') {
      S.papel = t.value === '80' ? '80' : '58';
      try { localStorage.setItem('hoja-papel', S.papel); } catch (e) { /* sin almacenamiento */ }
      return;
    }
    if (S.formPedido && t.closest('#form-pedido')) {
      const fp = S.formPedido;
      if (f === 'cliente') fp.cliente = t.value;
      else if (f === 'fecha') fp.fecha = t.value;
      else if (f === 'cant') fp.items[Number(t.dataset.i)].c = t.value;
      else if (f === 'art') {
        const i = Number(t.dataset.i), it = fp.items[i];
        const a = S.articulos.find(x => x.id === t.value);
        if (a) { it.a = a.id; it.n = a.nombre; it.u = a.unidad; it.p = a.precio != null ? a.precio : undefined; }
        else if (!t.value) { it.a = ''; it.n = ''; it.u = ''; }
        const u = $('#fp-u-' + i); if (u) u.textContent = it.u;
      }
      if (f === 'cant' || f === 'art') totalForm();
    } else if (S.formArt && t.closest('#form-art')) {
      if (f === 'nombre') S.formArt.nombre = t.value;
      else if (f === 'unidad') S.formArt.unidad = t.value;
      else if (f === 'precio') S.formArt.precio = t.value;
    }
  }
  document.addEventListener('input', e => {
    if (e.target.id === 'buscar') { S.q = e.target.value; renderPedidos(); return; }
    capturar(e.target);
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches && t.matches('input[data-sel]')) { toggleSel(t.dataset.sel, t.checked); return; }
    capturar(t);
    if (t.dataset && t.dataset.f && t.dataset.f.startsWith('neg-')) guardarNegocio();
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'form-pedido') guardarPedido();
    else if (e.target.id === 'form-art') guardarArt();
    else if (e.target.id === 'form-login') entrar();
  });

  /* ---------- Conexión con la base ---------- */
  function initSel() {
    if (S.seedSel) return;
    S.seedSel = true;
    if (S.pedidos.some(p => p.ejemplo)) ordenados().slice(0, 3).forEach(p => S.sel.add(p.id));
  }
  function podarSel() {
    const ids = new Set(S.pedidos.map(p => p.id));
    for (const id of [...S.sel]) if (!ids.has(id)) S.sel.delete(id);
  }
  document.addEventListener('change', async e => {
    if (e.target.id !== 'archivo-respaldo') return;
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (!j || !Array.isArray(j.articulos) || !Array.isArray(j.pedidos)) throw new Error('formato');
      S.restaurar = limpiaRespaldo(j);
      renderAvisos();
    } catch (err) { aviso('Ese archivo no es un respaldo válido.'); }
  });

  document.addEventListener('change', async e => {
    if (e.target.id !== 'logo-archivo') return;
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      S.negocio.logo = await procesarLogo(f);
      if (guardarNegocio()) aviso('Logo guardado');
      renderNegocio();
    } catch (err) { aviso('No se pudo leer esa imagen. Prueba con un PNG o JPG.'); }
  });

  if (!lsLoad()) { sembrar(); lsSave(); }
  leerSesion();
  initSel();
  renderTodo();
  iniciarSync();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* opcional */ }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
